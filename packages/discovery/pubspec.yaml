name: discovery
description: >
  A thin bonsoir (mDNS/DNS-SD) wrapper shared by the Printer and Client apps:
  advertise a simulated Printer, and browse for one.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  bonsoir: ^5.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
